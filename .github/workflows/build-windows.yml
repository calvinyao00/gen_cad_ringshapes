name: 构建 Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: 构建 Windows EXE
        run: >-
          python -m PyInstaller
          --clean
          --noconfirm
          --onedir
          --windowed
          --name "环形拼接件生成器"
          ring_generator_gui.py

      - name: 上传 Windows 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: 环形拼接件生成器-windows
          path: dist/环形拼接件生成器
          if-no-files-found: error
